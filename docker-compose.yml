services:
  mysql:
    image: mysql:8.4
    container_name: fortyall-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: whis!34679
      MYSQL_DATABASE: fortyall_desk
      MYSQL_USER: fortyall
      MYSQL_PASSWORD: whis!34679
      TZ: Asia/Seoul
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
